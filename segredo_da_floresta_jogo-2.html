<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>O Segredo da Floresta — Capítulo 1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101711;color:#eef4e9;font-family:system-ui,Arial;display:flex;justify-content:center;min-height:100vh;padding:10px}.wrap{width:min(100%,980px)}header{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 9px}h1{font-size:clamp(18px,4vw,25px);margin:0}.sub{font-size:11px;color:#a8b9a8;letter-spacing:1px}.screen{background:#17251b;border:1px solid #3a503d;border-radius:16px;padding:9px;box-shadow:0 15px 50px #0008}canvas{display:block;width:100%;height:auto;border-radius:10px;background:#254b31;touch-action:none}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 2px 2px;font-size:12px}.quest{color:#d6edab}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:8px}.leftinfo{font-size:11px;color:#b6c5b5;max-width:48%;line-height:1.4}.rightcontrols{display:flex;align-items:flex-end;gap:12px}.switch{display:flex;gap:4px;margin-bottom:6px}.switch button,.action{background:#263d2b;border:1px solid #55745a;color:#f1f5eb;border-radius:9px;padding:7px 10px;font-size:11px}.switch button.active{background:#527b4d}.pad{display:grid;grid-template-columns:repeat(3,39px);grid-template-rows:repeat(2,35px);gap:3px}.pad button{background:#2b4432dd;border:1px solid #78907a;color:white;border-radius:9px;font-size:17px;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.stickarea{width:112px;height:112px;display:grid;place-items:center;touch-action:none}.stickbase{width:108px;height:108px;border-radius:50%;border:2px solid #79947d;background:#314a36aa;position:relative;touch-action:none}.knob{position:absolute;width:44px;height:44px;left:30px;top:30px;border-radius:50%;background:#9bb99d;border:2px solid #e0ebdc;pointer-events:none}.action{font-size:12px;padding:11px 13px;max-width:100px;touch-action:none;user-select:none}.action.held{background:#527b4d;transform:scale(.97)}.small{font-size:10px;color:#8fa18e;margin-top:8px}[hidden]{display:none!important}@media(max-width:520px){.leftinfo{max-width:36%}.rightcontrols{gap:7px}.pad{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(2,32px)}.stickarea{width:95px;height:95px}.stickbase{width:92px;height:92px}.knob{left:24px;top:24px}.action{padding:9px 8px}}
</style></head><body><main class="wrap">
<header><div><h1>🌲 O SEGREDO DA FLORESTA</h1><div class="sub">CAPÍTULO 1 · O DESPERTAR</div></div><div class="sub">PROTÓTIPO 0.2</div></header>
<div class="screen"><canvas id="c" width="900" height="540"></canvas>
<div class="hud"><span class="quest" id="quest">◆ MISSÃO: encontre o fragmento azul</span><span>Fragmentos: <b id="frags">0/1</b>　 ♥ <b id="health">100</b>%</span></div>
<div class="bottom"><div class="leftinfo" id="msg">Você acorda sozinho. A floresta parece observar cada passo.</div>
<div class="rightcontrols"><button class="action" id="sprint">CORRER</button><button class="action" id="act">INTERAGIR</button><div><div class="switch"><button id="ar" class="active">Setas</button><button id="an">Analógico</button></div><div id="pad" class="pad"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button><button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div><div id="stickarea" class="stickarea" hidden><div id="stickbase" class="stickbase"><div id="knob" class="knob"></div></div></div></div></div></div>
<div class="small">WASD / setas no computador · controles táteis no celular · aproxime-se dos pontos de interesse e toque em INTERAGIR.</div>
</div></main>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W=900,H=540;
let p={x:155,y:390,vx:0,vy:0,angle:0},cam={x:0,y:0},keys={},touch={},sprinting=false,collected=false,near='',message='Você acorda sozinho. A floresta parece observar cada passo.',health=100;
const shard={x:665,y:205},cabin={x:760,y:370},oldStone={x:390,y:130};
let seed=87;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const trees=[];for(let i=0;i<155;i++){let x=rnd()*1500-250,y=rnd()*1050-250;if(Math.hypot(x-155,y-390)>90&&Math.hypot(x-shard.x,y-shard.y)>75)trees.push({x,y,r:18+rnd()*25,shade:rnd()})}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function tree(t){let x=t.x-cam.x,y=t.y-cam.y;if(x<-80||x>W+80||y<-100||y>H+100)return;ellipse(x,y+15,t.r*.65,t.r*.32,'#183323');ctx.fillStyle='#4a3525';ctx.fillRect(x-5,y-2,10,29);ellipse(x,y-13,t.r,t.r*.83,t.shade>.5?'#245535':'#1d492f');ellipse(x-9,y-20,t.r*.65,t.r*.55,'#326441');ellipse(x+9,y-12,t.r*.58,t.r*.5,'#2a5a38')}
function drawPath(){ctx.strokeStyle='#746a4a';ctx.lineWidth=105;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(80-cam.x,480-cam.y);ctx.bezierCurveTo(300-cam.x,440-cam.y,350-cam.x,260-cam.y,535-cam.x,250-cam.y);ctx.bezierCurveTo(650-cam.x,245-cam.y,690-cam.x,300-cam.y,820-cam.x,360-cam.y);ctx.stroke();ctx.strokeStyle='#98865a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(80-cam.x,480-cam.y);ctx.bezierCurveTo(300-cam.x,440-cam.y,350-cam.x,260-cam.y,535-cam.x,250-cam.y);ctx.bezierCurveTo(650-cam.x,245-cam.y,690-cam.x,300-cam.y,820-cam.x,360-cam.y);ctx.stroke()}
function drawCabin(){let x=cabin.x-cam.x,y=cabin.y-cam.y;ctx.fillStyle='#382c20';ctx.fillRect(x-57,y-43,114,75);ctx.fillStyle='#60452d';ctx.beginPath();ctx.moveTo(x-70,y-42);ctx.lineTo(x,y-95);ctx.lineTo(x+70,y-42);ctx.closePath();ctx.fill();ctx.fillStyle='#1b211b';ctx.fillRect(x-14,y-5,29,37);ctx.fillStyle='#8a754b';ctx.fillRect(x-47,y-25,20,17);ctx.fillStyle='#9b8050';ctx.fillRect(x+28,y-25,18,17)}
function drawShard(){let x=shard.x-cam.x,y=shard.y-cam.y;if(collected)return;let g=ctx.createRadialGradient(x,y,2,x,y,75);g.addColorStop(0,'#74faff88');g.addColorStop(1,'#74faff00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,75,0,7);ctx.fill();ctx.save();ctx.translate(x,y-12);ctx.rotate(Math.PI/4);ctx.fillStyle='#8efaff';ctx.shadowColor='#62f6ff';ctx.shadowBlur=22;ctx.fillRect(-9,-9,18,18);ctx.restore();ctx.shadowBlur=0}
function drawPlayer(){let x=p.x-cam.x,y=p.y-cam.y;ctx.save();ctx.translate(x,y);ctx.rotate(p.angle);x=0;y=0;ellipse(x,y+20,17,8,'#12201799'); // legs and boots
ctx.fillStyle='#252a25';ctx.fillRect(x-10,y+5,8,20);ctx.fillRect(x+3,y+5,8,20);ctx.fillStyle='#171b19';ctx.fillRect(x-12,y+21,11,7);ctx.fillRect(x+2,y+21,11,7);
ctx.fillStyle='#111b18';ctx.fillRect(x-14,y-1,28,20);ctx.fillStyle='#3b443a';ctx.fillRect(x-18,y+1,7,13);ctx.fillRect(x+11,y+1,7,13);
ctx.fillStyle='#30352e';ctx.fillRect(x-17,y-5,7,16);ctx.fillRect(x+10,y-5,7,16); // backpack straps
ctx.fillStyle='#59452f';ctx.fillRect(x-11,y-3,5,15);ctx.fillRect(x+6,y-3,5,15);
ellipse(x,y-12,9,10,'#9b6548'); // face
ctx.fillStyle='#17130f';for(let i=0;i<9;i++){let a=(i-4)*3;ellipse(x+a,y-21+Math.abs(i-4)*.7,4,5,'#171514')}
}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#315c3a';ctx.fillRect(0,0,W,H);for(let i=0;i<420;i++){let x=(i*127)%W,y=(i*71)%H;ctx.fillStyle=i%2?'#3c6941':'#477448';ctx.fillRect(x,y,2,3)}drawPath();trees.forEach(tree);drawCabin();drawShard(); // ruins
let rx=oldStone.x-cam.x,ry=oldStone.y-cam.y;ctx.fillStyle='#77786a';ctx.fillRect(rx-32,ry-20,64,18);ctx.fillRect(rx-26,ry-70,13,55);ctx.fillRect(rx+13,ry-60,13,45);ctx.fillStyle='#a1a18b';ctx.fillRect(rx-30,ry-72,21,8);
drawPlayer();let vg=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,490);vg.addColorStop(0,'#0000');vg.addColorStop(1,'#08150d99');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function update(){let dx=0,dy=0;if(keys.ArrowUp||keys.w||touch.up)dy--;if(keys.ArrowDown||keys.s||touch.down)dy++;if(keys.ArrowLeft||keys.a||touch.left)dx--;if(keys.ArrowRight||keys.d||touch.right)dx++;let l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l;p.angle=Math.atan2(dy,dx)+Math.PI/2;}let max=sprinting?4.1:2.35,accel=.22;p.vx+=(dx*max-p.vx)*accel;p.vy+=(dy*max-p.vy)*accel;if(!l){p.vx*=.78;p.vy*=.78;}p.x+=p.vx;p.y+=p.vy;p.x=Math.max(25,Math.min(1400,p.x));p.y=Math.max(25,Math.min(950,p.y));cam.x+=(Math.max(0,Math.min(600,p.x-W/2))-cam.x)*.10;cam.y+=(Math.max(0,Math.min(510,p.y-H/2))-cam.y)*.10;near=';if(Math.hypot(p.x-shard.x,p.y-shard.y)<65&&!collected)near='fragmento';if(Math.hypot(p.x-cabin.x,p.y-cabin.y)<90)near='cabana';if(Math.hypot(p.x-oldStone.x,p.y-oldStone.y)<75)near='ruinas';document.getElementById('act').style.opacity=near?'1':'.65';}
function loop(){update();draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-d]').forEach(b=>{let d=b.dataset.d;b.addEventListener('pointerdown',e=>{e.preventDefault();touch[d]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>touch[d]=false))});
const pad=document.getElementById('pad'),area=document.getElementById('stickarea'),base=document.getElementById('stickbase'),knob=document.getElementById('knob');function mode(m){let a=m==='ar';pad.hidden=!a;area.hidden=a;document.getElementById('ar').classList.toggle('active',a);document.getElementById('an').classList.toggle('active',!a);reset()}document.getElementById('ar').onclick=()=>mode('ar');document.getElementById('an').onclick=()=>mode('an');
let pid=null;function stick(e){let r=base.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy)||1,max=32;if(len>max){dx=dx/len*max;dy=dy/len*max}knob.style.transform=`translate(${dx}px,${dy}px)`;touch.left=dx<-8;touch.right=dx>8;touch.up=dy<-8;touch.down=dy>8}function reset(){pid=null;knob.style.transform='translate(0,0)';touch.up=touch.down=touch.left=touch.right=false}
base.addEventListener('pointerdown',e=>{pid=e.pointerId;base.setPointerCapture(pid);stick(e)});base.addEventListener('pointermove',e=>{if(e.pointerId===pid)stick(e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>base.addEventListener(ev,reset));
const sprintBtn=document.getElementById('sprint');sprintBtn.addEventListener('pointerdown',e=>{e.preventDefault();sprinting=true;sprintBtn.classList.add('held');sprintBtn.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>sprintBtn.addEventListener(ev,()=>{sprinting=false;sprintBtn.classList.remove('held')}));window.addEventListener('keydown',e=>{if(e.key==='Shift')sprinting=true});window.addEventListener('keyup',e=>{if(e.key==='Shift')sprinting=false});
document.getElementById('act').onclick=()=>{if(near==='fragmento'){collected=true;document.getElementById('frags').textContent='1/1';document.getElementById('quest').textContent='◆ MISSÃO ATUALIZADA: investigue a cabana';message='O fragmento pulsa em sua mão. Uma lembrança surge: a cabana guarda a próxima pista.'}else if(near==='cabana'){message='A porta está entreaberta. Há marcas recentes na madeira...';document.getElementById('quest').textContent='◆ A cabana pode esconder respostas'}else if(near==='ruinas'){message='As pedras têm símbolos antigos. Um deles parece idêntico ao fragmento.'}else{message='Não há nada ao alcance. Explore a trilha e procure o brilho azul.'}document.getElementById('msg').textContent=message};
loop();
</script></body></html>
